<style>
:root{--ink:#1c2b27;--mut:#6b7c77;--bg:#f6f8f7;--card:#fff;--line:#e5ebe8;--pri:#0f6b57;--pri2:#0a5444;--soft:#e8f3ef;--acc:#e0a030;--bad:#c0362c;--ok:#1d7a45;--warn:#a8630a;--r:14px;--sh:0 1px 2px rgba(20,40,35,.05),0 4px 14px rgba(20,40,35,.05)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em;font-weight:700}
button,input,select{font:inherit}
.hide{display:none!important}
.mut{color:var(--mut)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 500px at 50% -10%,#d9ede6,transparent),var(--bg)}
.lbox{background:#fff;border-radius:20px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(15,70,55,.12);border:1px solid var(--line)}
.logo{display:block;margin:0 auto 14px;width:auto;height:100px}
.lbox h1,.lbox>p{text-align:center}
.lbox h1{font-size:22px;margin-bottom:4px;color:var(--pri)}
/* shell */
header{background:#fff;color:var(--ink);height:56px;padding:0 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
header b{font-size:14.5px;flex:1;line-height:1.25;font-weight:700}
header small{color:var(--mut);display:block;font-weight:500;font-size:12px}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;padding:0 12px;height:46px;position:sticky;top:56px;z-index:4;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--mut);padding:0 14px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-weight:500;font-size:14px}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.row>*{flex:0 1 auto}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:5px}
input,select{width:100%;padding:10px 12px;border:1px solid #d6dfdb;border-radius:10px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px rgba(15,107,87,.15)}
button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600;transition:background .15s}
.btn:hover{background:var(--pri2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.s{padding:5px 12px;font-size:13px;border-radius:8px}
.btn.g{background:var(--soft);color:var(--pri)}.btn.g:hover{background:#d6eae3}
.btn.d{background:#fdecea;color:var(--bad)}.btn.d:hover{background:#fadbd7}
.btn.big{padding:15px;font-size:16px;width:100%;border-radius:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--bg);border-radius:12px;padding:14px 16px}
.stat span{font-size:12.5px;font-weight:500}
.stat b{font-size:28px;display:block;font-weight:700;letter-spacing:-.02em;color:var(--pri)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f6f8f7;font-weight:600;font-size:12.5px;color:var(--mut);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafcfb}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#eef2f0;color:var(--mut)}
.tag.ok{background:#e1f4e8;color:var(--ok)}.tag.bad{background:#fdecea;color:var(--bad)}.tag.warn{background:#fdf0d9;color:var(--warn)}
.clock{font-size:52px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--pri);line-height:1.15}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:var(--bg);border-radius:12px;padding:14px 16px}
.box b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
#msg{margin:14px 0;padding:11px 14px;border-radius:10px;background:var(--soft);color:var(--pri2);font-size:14px}
#msg.ok{background:#e1f4e8;color:var(--ok)}#msg.bad{background:#fdecea;color:var(--bad)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;z-index:30;max-width:90vw;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;background:rgba(20,35,30,.45);backdrop-filter:blur(3px);display:grid;place-items:center;padding:14px;z-index:20}
.modal form{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal .f{margin-bottom:12px}.modal .chk{display:flex;gap:8px;align-items:center}.modal .chk input{width:auto}
.err{color:var(--bad);min-height:20px;font-size:13.5px}
@media(max-width:560px){.clock{font-size:42px}main{padding:14px 12px 32px}.card{padding:16px}}
@media(prefers-reduced-motion:no-preference){.card{animation:in .25s}}@keyframes in{from{opacity:0}to{opacity:1}}

/* ===== RESPONSIVE ===== */
header{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
header b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{padding-left:max(12px,env(safe-area-inset-left))}
.row>*{min-width:0}
@media(min-width:1280px){main{max-width:1200px}}
@media(max-width:900px){
  .row>*{flex:1 1 150px}
  .row>.btn{flex:1 1 auto}
}
@media(max-width:700px){
  body{font-size:15px}
  input,select{font-size:16px;min-height:44px}
  .btn{min-height:44px}
  .btn.s{min-height:36px}
  nav button{min-height:44px}
  #toast{bottom:calc(18px + env(safe-area-inset-bottom))}
  /* tabel menjadi kartu */
  .tw{border:0;overflow:visible}
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tbody tr{border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:10px;background:#fff;box-shadow:var(--sh)}
  tbody tr:hover{background:#fff}
  td{position:relative;padding:9px 0 9px 40%;text-align:right;white-space:normal;border-bottom:1px dashed var(--line);min-height:38px;word-break:break-word}
  td:last-child{border-bottom:0}
  td::before{content:attr(data-l);position:absolute;left:0;top:9px;width:36%;text-align:left;color:var(--mut);font-weight:600;font-size:12.5px}
  td[data-l=""]{padding-left:0;text-align:left}
  td[data-l=""]::before{display:none}
  td [style*="max-width"]{max-width:none!important}
  td .btn+.btn{margin-top:4px}
}
@media(max-width:560px){
  .modal{align-items:end;padding:0}
  .modal form{max-width:none;border-radius:20px 20px 0 0;max-height:92vh;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
  .lbox{padding:26px 20px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .stat b{font-size:24px}
  .card{padding:14px}
}
@media(max-width:360px){
  .two{grid-template-columns:1fr}
  .clock{font-size:36px}
}
@media(max-height:480px) and (orientation:landscape){
  #login{place-items:start center}
  .logo{height:64px}
}
</style>
</head>

    <h1>Absensi PPPK PW</h1>
    <p class="mut" style="margin:0 0 18px">Disparekrafpora Kabupaten Gunungkidul</p>
    <div class="f" style="margin-bottom:10px"><label for="u">Username</label><input id="u" autocomplete="username" required></div>
    <div class="f" style="margin-bottom:10px"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
    <div class="err" id="le"></div>
    <button class="btn big" id="lb">Masuk</button>
  </form>
</section>

<div id="app" class="hide">
  <header><b id="hn"></b><button class="btn g s" id="lo">Keluar</button></header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast" class="hide"></div>

<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=v=>v?String(v).slice(0,5):'-';
let TOKEN=localStorage.getItem('tok')||'',USER=null,BIDANG=[],TIMER=null;

async function api(action,d){
  let r;
  try{
    r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:TOKEN},d||{}))}).then(x=>x.json());
  }catch(e){throw new Error('Tidak dapat terhubung ke server. Periksa koneksi dan URL Web App.')}
  if(!r.ok){
    if(r.code==='AUTH'&&action!=='login'){bye();}
    const e=new Error(r.error||'Terjadi kesalahan.');e.code=r.code;throw e;
  }
  return r;
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),3200)}
async function run(fn){try{await fn()}catch(e){toast(e.message)}}

/* ---------- login / sesi ---------- */
$('#lf').onsubmit=async ev=>{
  ev.preventDefault();$('#le').textContent='';$('#lb').disabled=true;
  try{
    const r=await api('login',{username:$('#u').value,password:$('#p').value});
    TOKEN=r.token;localStorage.setItem('tok',TOKEN);USER=r.user;BIDANG=r.bidang;start();
  }catch(e){$('#le').textContent=e.message}
  $('#lb').disabled=false;
};
$('#lo').onclick=async()=>{try{await api('logout')}catch(e){}bye()};
function bye(){TOKEN='';localStorage.removeItem('tok');clearInterval(TIMER);$('#app').classList.add('hide');$('#login').classList.remove('hide');$('#p').value=''}
async function boot(){
  if(API_URL.startsWith('GANTI'))return($('#le').textContent='URL Web App belum diisi di file index.html.');
  if(!TOKEN)return;
  try{const r=await api('me');USER=r.user;BIDANG=r.bidang;start()}catch(e){}
}
function start(){
  $('#login').classList.add('hide');$('#app').classList.remove('hide');
  $('#hn').innerHTML=esc(USER.Nama)+'<small>'+esc(USER.Role==='ADMIN'?'Administrator':USER.Bidang)+'</small>';
  const adm=USER.Role==='ADMIN';
  const tabs=adm?[['dash','Dashboard'],['mon','Monitoring'],['rekapA','Rekap'],['dlA','Dinas Luar'],['kerjaA','Buku Kerja'],['users','Pegawai'],['gps','Lokasi GPS'],['set','Pengaturan'],['hol','Hari Libur'],['log','Log'],['akun','Akun']]
               :[['absen','Absen'],['kerja','Buku Kerja'],['dl','Dinas Luar'],['riw','Riwayat'],['rekap','Rekap Saya'],['akun','Akun']];
  $('#nav').innerHTML=tabs.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
  $('#nav').onclick=e=>{const t=e.target.dataset.t;if(t)go(t)};
  go(tabs[0][0]);
}
function go(t){
  clearInterval(TIMER);
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#main').innerHTML='<p class="mut">Memuat…</p>';
  run(()=>V[t]());
}

/* ---------- util UI ---------- */
function tbl(heads,rows,empty){
  if(!rows.length)return `<p class="mut">${empty||'Belum ada data.'}</p>`;
  return `<div class="tw"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td data-l="${heads[i]||''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const stTag=s=>s==='Tepat Waktu'?'<span class="tag ok">Tepat Waktu</span>':s==='Terlambat'?'<span class="tag warn">Terlambat</span>':s==='Belum Absen'?'<span class="tag bad">Belum Absen</span>':s?`<span class="tag">${esc(s)}</span>`:'-';
const opts=(a,sel,all)=>(all!==undefined?`<option value="">${all}</option>`:'')+a.map(x=>{const v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:x;return `<option value="${esc(v)}"${String(v)===String(sel)?' selected':''}>${esc(l)}</option>`}).join('');
const today=()=>new Date(Date.now()+(new Date().getTimezoneOffset()+420)*60000).toISOString().slice(0,10);

function form(title,fields,onSave){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<form><h3 style="margin-bottom:14px">${esc(title)}</h3>${fields.map(f=>{
    const v=f.v==null?'':f.v,id='f_'+f.k;
    if(f.t==='check')return `<div class="f chk"><input type="checkbox" id="${id}"${v?' checked':''}><label for="${id}" style="margin:0">${f.l}</label></div>`;
    if(f.t==='select')return `<div class="f"><label for="${id}">${f.l}</label><select id="${id}">${opts(f.o,v)}</select></div>`;
    return `<div class="f"><label for="${id}">${f.l}</label><input id="${id}" type="${f.t||'text'}" value="${esc(v)}"${f.step?` step="${f.step}"`:''}${f.ph?` placeholder="${esc(f.ph)}"`:''}></div>`}).join('')}
    <div class="err"></div><div class="row" style="justify-content:flex-end;margin:0"><button type="button" class="btn g" id="x">Batal</button><button class="btn">Simpan</button></div></form>`;
  document.body.appendChild(m);
  m.querySelector('#x').onclick=()=>m.remove();
  m.querySelector('form').onsubmit=async e=>{
    e.preventDefault();const d={};
    fields.forEach(f=>{const el=m.querySelector('#f_'+f.k);d[f.k]=f.t==='check'?el.checked:el.value});
    try{await onSave(d);m.remove()}catch(x){m.querySelector('.err').textContent=x.message}
  };
}
async function download(r){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.csv],{type:'text/csv;charset=utf-8'}));a.download=r.filename;a.click();URL.revokeObjectURL(a.href);
}
function getPos(){
  return new Promise((ok,no)=>{
    if(!navigator.geolocation)return no(new Error('Peramban tidak mendukung GPS.'));
    navigator.geolocation.getCurrentPosition(p=>ok({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,isMock:false}),
      e=>no(new Error(e.code===1?'Izin lokasi ditolak. Aktifkan izin lokasi untuk situs ini.':'Lokasi tidak dapat diambil. Aktifkan GPS lalu coba lagi.')),
      {enableHighAccuracy:true,timeout:20000,maximumAge:0});
  });
}

    $('#o').innerHTML=tbl(['Tanggal','Tujuan','No. surat tugas','Status',''],r.rows.map((x,i)=>[x.TanggalMulai===x.TanggalSelesai?x.TanggalMulai:x.TanggalMulai+' s.d. '+x.TanggalSelesai,`<span style="white-space:normal;display:block;max-width:340px">${esc(x.Tujuan)}</span>`,esc(x.NoSuratTugas),dlTag(x.Status),x.Status==='Menunggu'?`<button class="btn d s" data-i="${i}">Batalkan</button>`:'']),'Belum ada pengajuan.');
    $('#o').onclick=e=>{const i=e.target.dataset.i;if(i===undefined)return;run(async()=>{await api('cancelDL',{dlId:r.rows[i].DLID});toast('Pengajuan dibatalkan.');load()})}});
  $('#add').onclick=()=>form('Ajukan dinas luar',[{k:'tanggalMulai',l:'Tanggal mulai',t:'date',v:today()},{k:'tanggalSelesai',l:'Tanggal selesai',t:'date',v:today()},{k:'tujuan',l:'Tujuan / kegiatan'},{k:'noSuratTugas',l:'No. surat tugas (opsional)'}],
    async d=>{const r=await api('requestDL',d);toast(r.message);load()});
  load();
};

V.dlA=async()=>{
  $('#main').innerHTML=`<div class="card"><div class="row"><div><label>Status</label><select id="st">${opts(['Menunggu','Disetujui','Ditolak','Dibatalkan'],'Menunggu','Semua')}</select></div><div><label>Bidang</label><select id="bd">${opts(BIDANG,'','Semua')}</select></div></div><div id="o"></div></div>`;
  const load=()=>run(async()=>{const r=await api('listDL',{status:$('#st').value,bidang:$('#bd').value});
    $('#o').innerHTML=tbl(['Pegawai','Bidang','Tanggal','Tujuan','Surat tugas','Status',''],r.rows.map((x,i)=>[esc(x.Nama),esc(x.Bidang),x.TanggalMulai===x.TanggalSelesai?x.TanggalMulai:x.TanggalMulai+' s.d. '+x.TanggalSelesai,`<span style="white-space:normal;display:block;max-width:300px">${esc(x.Tujuan)}</span>`,esc(x.NoSuratTugas),dlTag(x.Status)+(x.DiputuskanOleh?' <span class="mut">oleh '+esc(x.DiputuskanOleh)+'</span>':''),
      x.Status==='Menunggu'?`<button class="btn s" data-k="Disetujui" data-i="${i}">Setujui</button> <button class="btn d s" data-k="Ditolak" data-i="${i}">Tolak</button>`:'']),'Tidak ada pengajuan.');
    $('#o').onclick=e=>{const k=e.target.dataset.k;if(!k)return;run(async()=>{await api('decideDL',{dlId:r.rows[e.target.dataset.i].DLID,keputusan:k});toast('Diputuskan: '+k);load()})}});
  $('#st').onchange=load;$('#bd').onchange=load;load();
};

V.kerjaA=async()=>{
  $('#main').innerHTML=`<div class="card"><div class="row"><div><label>Dari</label><input type="date" id="a" value="${today().slice(0,8)}01"></div><div><label>Sampai</label><input type="date" id="b" value="${today()}"></div>
  <div><label>Bidang</label><select id="bd">${opts(BIDANG,'','Semua')}</select></div><div><label>Cari</label><input id="q"></div><button class="btn" id="go">Tampilkan</button></div><div id="o"></div></div>`;
  const load=()=>run(async()=>{const r=await api('listWork',{from:$('#a').value,to:$('#b').value,bidang:$('#bd').value,q:$('#q').value});
    $('#o').innerHTML=`<p class="mut">${r.total} catatan</p>`+tbl(['Tanggal','Pegawai','Bidang','Kegiatan','Output'],r.rows.map(x=>[x.Tanggal,esc(x.Nama),esc(x.Bidang),`<span style="white-space:normal;display:block;max-width:360px">${esc(x.Kegiatan)}</span>`,esc(x.Output)]))});
  $('#go').onclick=load;load();
};

boot();
</script>
</body>
</html>
